name: app_default
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # ---------- Firebase ----------
  firebase_analytics: ^12.4.6
  firebase_core: ^4.13.0
  firebase_core_platform_interface: ^8.1.0
  firebase_crashlytics: ^5.2.7
  firebase_messaging: ^16.5.0
  firebase_remote_config: ^6.5.6
  google_mobile_ads: ^9.1.0

  # ---------- GMA MEDIATION ----------
  gma_mediation_meta: ^1.4.3
  gma_mediation_pangle: 4.1.1
  #gma_mediation_applovin: ^2.4.0
  gma_mediation_liftoffmonetize: ^1.4.1

  # ---------- EXO ADS ----------
  get: ^4.7.3
  exo_ads:
    git:
      url: git@github.com:trungs99/exo_module.git
      ref: V1.5
      path: exo_ads
  app_settings: ^5.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7
  flutter_flavorizr: ^2.4.1

# Flavorizr
flavorizr:
  flavors:
    dev:
      app:
        name: "(Dev) App Default"
      android:
        applicationId: "com.example.app_default.dev"
    prod:
      app:
        name: "App Default"
      android:
        applicationId: "com.example.app_default"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/img_default/intro/
    - assets/img_default/no_internet/
    - assets/img_default/splash/
    - assets/img_default/wcb/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_app.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
flutter_native_splash:
  color: "#000000"
  image: assets/img_default/splash/ic_native_splash.png
  android_12:
    color: "#000000"
    image: assets/img_default/splash/ic_native_splash.png
  fullscreen: false
  android_gravity: center
  ios_content_mode: center